        function recreate() {

            var ifr = document.createElement("iframe")
            ifr.src = "about:blank"
            ifr.setAttribute("sandbox", "allow-same-origin")
            ifr.addEventListener("load", (e) => {
            })
            window.container.appendChild(ifr)
            // var ifrDoc = ifr.contentWindow.document
            var ifrCntDoc = ifr.contentDocument
            var ifrDoc = ifrCntDoc.documentElement

            var htmlEl = ifrDoc.getElementsByTagName("html")[0]
            var headEl = ifrDoc.getElementsByTagName("head")[0]
            
            var textN = ifrCntDoc.createTextNode("h3 Element")
            var divN = ifrCntDoc.createElement("h3")
            divN.appendChild(textN)
            ifrCntDoc.body.appendChild(divN)
            return

            var lastEl

            for (let index = 0; index < logs.length; index++) {
                const log = logs[index];
                if(log.type == "childList") {
                    const { addedNodes, target } = log

                    switch(target.tagName) {
                        case "HEAD":
                            log.addedNodes.forEach(n => {
                                headEl.appendChild(document.importNode(n))
                            })
                            lastEl = headEl
                            break;

                        case "BODY":
                            log.addedNodes.forEach(n => {
                                bodyEl.appendChild(document.importNode(n))
                            })
                            lastEl = bodyEl
                            break;

                        case "HTML":
                            log.addedNodes.forEach(n => {
                                htmlEl.appendChild(document.importNode(n))
                            })
                            lastEl = htmlEl
                            break;

                        default:
                            log.addedNodes.forEach(n => {
                                lastEl.appendChild(document.importNode(n))
                            })
                            lastEl = log.target.cloneNode()
                            break;
                    }
                }
            }
        }

        function isNodeText(node) {
            if(node) {
                if(node.nodeName == "#text" && !node.tagName) {
                    return true
                }
            }
            return false
        }
    </script>
